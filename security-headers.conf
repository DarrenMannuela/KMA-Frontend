# Sent with every response (included from nginx.conf).
# - nosniff: a file is only ever treated as the type it's served as.
# - SAMEORIGIN: other sites can't show KMA inside a frame of theirs (to
#   trick someone into clicking); KMA's own pages still can.
# - same-origin referrer: addresses inside KMA (order numbers in the URL)
#   aren't sent to Google Fonts or any other site.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
