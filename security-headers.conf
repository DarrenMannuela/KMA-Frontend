# Sent with every response (included from nginx.conf).
# - nosniff: a file is only ever treated as the type it's served as.
# - SAMEORIGIN: other sites can't show KMA inside a frame of theirs (to
#   trick someone into clicking); KMA's own pages still can.
# - same-origin referrer: addresses inside KMA (order numbers in the URL)
#   aren't sent to Google Fonts or any other site.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;

# HTTPS is actually terminated by `tailscale serve` in front of this
# container, not nginx itself (see nginx.conf: it only ever listens on
# plain :80) — so there's no live plain-HTTP path to downgrade from
# today. This is still cheap insurance against that ever changing.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# This app doesn't use any of these from the browser; turning them off
# means a future bug (or a compromised dependency) can't quietly start
# asking for them either.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Content-Security-Policy: the real second layer of XSS defense — even if
# a script somehow got injected (there's no known way in today: nothing
# in this app uses dangerouslySetInnerHTML, confirmed by search), this
# stops it from running or phoning home anywhere not explicitly allowed.
#
# script-src: same-origin bundles only, plus one specific inline script —
# index.html's dark-mode flash-of-wrong-theme fix (see ThemeContext.tsx).
# Allowed by exact SHA-256 hash, not 'unsafe-inline': only that one exact
# script can run inline, nothing else. If that script's content ever
# changes, this hash must be regenerated or it silently stops running
# (the page still works, dark mode just flashes light for a moment before
# React mounts) — recompute with:
#   node -e "const c=require('fs').readFileSync('dist/index.html','utf8').match(/<script>([\s\S]*?)<\/script>/)[1]; console.log('sha256-'+require('crypto').createHash('sha256').update(c).digest('base64'))"
#
# style-src needs 'unsafe-inline': this app uses React's style={{...}}
# prop extensively (print pages especially), which compiles to inline
# style attributes — locking that down would mean rewriting a large
# fraction of the app's styling, not a header change. Inline styles are a
# far smaller XSS risk than inline scripts (can't exfiltrate data or call
# APIs on their own), which is why script-src is strict and style-src
# isn't.
#
# img-src allows data: for the 2FA setup QR code (QRCode.toDataURL()).
# connect-src 'self' covers every API call: /api/, /auth/ and /uploads/
# are all proxied through nginx onto this same origin (see below), so
# nothing needs a separate allowance.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-D2Pg7emmPC1B0RVCpsQzdkvO7zrwVSATHo/5fzZny5U='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
