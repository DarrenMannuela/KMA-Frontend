server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to 1MB — well under the backend's own 5MB photo cap
    # (see maxPhotoSize in UploadClientItemPhoto), so without this, most
    # real camera photos get rejected here with a 413 before the request
    # even reaches the Go server to apply its own limit.
    client_max_body_size 10M;

    # Proxy /api requests to the backend service
    location /api/ {
        proxy_pass http://kma_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy /uploads requests (client-item photos) to the backend service —
    # without this, requests fall through to the SPA catch-all below and get
    # served index.html instead of the actual image, which the <img> tag
    # can't render (fails silently into the onError/broken-photo state).
    location /uploads/ {
        proxy_pass http://kma_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy /auth/ requests to the standalone auth service. Routing
    # through nginx (instead of hitting kma_auth_backend:8001 directly
    # from the browser) means the frontend and the auth API are the
    # SAME origin as far as the browser is concerned — no CORS
    # configuration needed, and the session/CSRF cookies just work as
    # ordinary same-origin cookies rather than needing to be reasoned
    # about across ports.
    location /auth/ {
        proxy_pass http://kma_auth_backend:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — send all other requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}