server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening for every response. In a file of its own because
    # nginx drops server-level add_header lines in any location that adds
    # a header of its own (the caching ones below), so each of those
    # includes it again.
    include /etc/nginx/security-headers.conf;

    # Compress text going out: the app's scripts shrink to about a third,
    # which phones on mobile data notice.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Docker's embedded DNS. Using a variable in proxy_pass (instead of
    # a bare hostname) forces nginx to actually consult this resolver
    # per-request rather than resolving once at startup and caching
    # that IP forever — otherwise, every time kma_backend or
    # kma_auth_backend gets recreated (a redeploy, a rebuild), nginx
    # keeps sending traffic to the old container's dead IP until nginx
    # itself is restarted. valid=10s caps how long a resolved IP is
    # trusted before the next request re-checks it.
    resolver 127.0.0.11 valid=10s;

    # nginx defaults to 1MB — well under the backend's own 5MB photo cap
    # (see maxPhotoSize in UploadClientItemPhoto), so without this, most
    # real camera photos get rejected here with a 413 before the request
    # even reaches the Go server to apply its own limit.
    client_max_body_size 10M;

    # Proxy /api requests to the backend service. No rewrite needed —
    # the frontend already calls e.g. /api/v1/order, which matches
    # kma_backend's routes exactly, so the original path is forwarded
    # unchanged (proxy_pass has no URI part here).
    location /api/ {
        set $backend_upstream http://kma_backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        error_page 502 504 = @service_down;
    }

    # Proxy /uploads requests (client-item photos) to the backend service —
    # without this, requests fall through to the SPA catch-all below and get
    # served index.html instead of the actual image, which the <img> tag
    # can't render (fails silently into the onError/broken-photo state).
    location /uploads/ {
        set $backend_upstream http://kma_backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        error_page 502 504 = @service_down;
    }

    # Proxy /auth/ requests to the standalone auth service. Routing
    # through nginx (instead of hitting kma_auth_backend:8001 directly
    # from the browser) means the frontend and the auth API are the
    # SAME origin as far as the browser is concerned — no CORS
    # configuration needed, and the session/CSRF cookies just work as
    # ordinary same-origin cookies rather than needing to be reasoned
    # about across ports.
    #
    # The auth service's real routes live under /api/v1/auth/... (see
    # its main.go). The frontend already calls the FULL path prefixed
    # with /auth/, e.g. /auth/api/v1/auth/login — so this location
    # only needs to strip the leading /auth segment, not add anything
    # back in. (An earlier version of this rewrite incorrectly
    # re-added /api/v1/auth/, which doubled the path into
    # /api/v1/auth/api/v1/auth/login and 404'd.)
    #
    # IMPORTANT: with a variable in proxy_pass (needed above for the
    # dynamic DNS re-resolution fix), nginx does NOT do its usual
    # "replace the matched location prefix" trick — any URI you write
    # after the variable is instead used as the literal, entire target
    # path, discarding the rest of the original request URI. So the
    # rewrite has to be done explicitly here with `rewrite ... break`
    # BEFORE proxy_pass runs, and proxy_pass itself must have no URI
    # part (just the host) so it forwards the already-rewritten path
    # unchanged.
    #
    # ORDER MATTERS: `set` must come BEFORE `rewrite ... break`, not
    # after. `break` immediately stops processing any further
    # rewrite-phase directives in this location — and `set` is a
    # rewrite-phase directive too. Put `set` after `break` and it
    # silently never runs, leaving $auth_upstream empty and causing
    # "invalid URL prefix" / "uninitialized variable" errors.
    location /auth/ {
        set $auth_upstream http://kma_auth_backend:8001;
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        error_page 502 504 = @service_down;
    }

    # When nginx can't reach a backend at all (its container is stopped,
    # restarting, or being rebuilt — Docker's DNS then has no address for
    # it), answer like the API does, with JSON the frontend can show,
    # instead of nginx's HTML error page, which reached the screen as
    # "Request failed with status code 502". 502s the backends send
    # themselves pass through untouched (error_page only replaces
    # nginx's own unless proxy_intercept_errors is on).
    location @service_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        return 503 '{"error":"The server is starting up or restarting. Try again in a moment."}';
    }

    # Built scripts and styles have a hash in their names, so a name never
    # changes content: browsers can keep them for a year. A missing one
    # is a 404, not index.html: after an update, a page still open from
    # before asks for the old build's files, and getting HTML back for a
    # script broke the page outright; a 404 lets it reload into the new
    # build instead (see main.tsx).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # The page itself and the app manifest must always be checked for a
    # newer version, or an update only shows up whenever the browser's
    # cache happens to let go of the old one.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # SPA fallback — send all other requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}