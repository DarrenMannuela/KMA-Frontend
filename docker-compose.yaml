services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kma_frontend
    restart: unless-stopped
    ports:
      # KMA_WEB_BIND=127.0.0.1 in .env keeps the app off the local
      # network (Wi-Fi), reachable only from this computer, and through
      # `tailscale serve`, which connects from this computer too. Empty:
      # every network the computer is on. KMA_WEB_PORT picks the port; use
      # one above 1023 with 127.0.0.1 (e.g. 8088), since Docker Desktop
      # can't bind port 80 to one address without its privileged helper.
      - "${KMA_WEB_BIND:-0.0.0.0}:${KMA_WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Logs rotate: 5 files of 10 MB, so months of running never fill the
    # disk (Docker's default keeps every line forever).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - kma_network

networks:
  kma_network:
    external: true
    name: kma_network
